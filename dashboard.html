<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessel — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230A0A0A'/%3E%3Ctext%20x='50'%20y='68'%20font-family='Inter,%20sans-serif'%20font-weight='700'%20font-size='52'%20fill='%23FFFFFF'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A;
    --charcoal: #1A1A1A;
    --gray-dark: #4A4A4A;
    --gray-mid: #8A8A8A;
    --gray-light: #E5E5E5;
    --off-white: #FAFAFA;
    --white: #FFFFFF;
    --ease-quiet: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-precise: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--off-white);
    color: var(--black);
    overflow-x: hidden;
    position: relative;
    line-height: 1.6;
  }

  /* ===== Ambient Background Motion ===== */
  .bg-orbs {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.6;
    animation: float-orb 20s infinite ease-in-out;
  }
  .orb-1 { width: 600px; height: 600px; background: #E5E5E5; top: -10%; left: -10%; animation-duration: 25s; }
  .orb-2 { width: 500px; height: 500px; background: #F0F0F0; top: 40%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
  .orb-3 { width: 400px; height: 400px; background: #EFEFEF; bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
  @keyframes float-orb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 40px) scale(0.95); }
  }

  /* ===== Sidebar (Glassmorphism) ===== */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 260px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 4px 0 20px rgba(10, 10, 10, 0.03);
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    z-index: 100;
  }

  .brand { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--black); margin-bottom: 3rem; padding: 0 0.5rem; }
  .brand__mark { width: 32px; height: 32px; background: var(--black); border-radius: 8px; display: grid; place-items: center; color: var(--white); font-size: 1rem; font-weight: 800; }
  .brand__name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

  .nav-links { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }
  .nav-link { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--gray-dark); font-size: 0.95rem; font-weight: 500; padding: 0.75rem 1rem; border-radius: 8px; transition: all 0.2s ease; }
  .nav-link:hover { background: rgba(10, 10, 10, 0.05); color: var(--black); }
  .nav-link.active { background: var(--black); color: var(--white); }
  .nav-link svg { width: 20px; height: 20px; stroke-width: 1.5; }

  .sidebar-footer { border-top: 1px solid rgba(229, 229, 229, 0.6); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .user-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; margin-bottom: 0.5rem; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--black); color: var(--white); display: grid; place-items: center; font-size: 0.85rem; font-weight: 600; }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 0.9rem; font-weight: 600; color: var(--black); }
  .user-email { font-size: 0.75rem; color: var(--gray-mid); }

  .btn-logout { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--gray-dark); font-size: 0.95rem; font-weight: 500; padding: 0.75rem 1rem; border-radius: 8px; transition: all 0.2s ease; background: none; border: none; cursor: pointer; font-family: inherit; text-align: left; }
  .btn-logout:hover { background: rgba(10, 10, 10, 0.05); color: var(--black); }
  .btn-logout svg { width: 20px; height: 20px; stroke-width: 1.5; }

  /* ===== Main Layout ===== */
  .main-content {
    margin-left: 260px;
    padding: 3rem 3rem 6rem;
    min-height: 100vh;
    position: relative;
  }

  .page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--gray-light); }
  .eyebrow { display: inline-flex; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-dark); margin-bottom: 1rem; }
  .page-title { font-weight: 800; font-size: clamp(2.2rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -0.03em; color: var(--black); }
  .page-title em { font-style: normal; color: var(--gray-mid); font-weight: 800; }
  
  .btn-primary { background: var(--black); color: var(--white); border: 1px solid var(--black); padding: 0.8rem 1.4rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; transition: all 0.2s var(--ease-quiet); }
  .btn-primary:hover { background: transparent; color: var(--black); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(10, 10, 10, 0.1); }

  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.5rem; }
  
  .card { 
    background: rgba(255, 255, 255, 0.6); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px); 
    border: 1px solid rgba(255, 255, 255, 0.9); 
    padding: 1.75rem; 
    border-radius: 12px; 
    cursor: pointer; 
    text-decoration: none; 
    color: var(--black); 
    display: flex; 
    flex-direction: column; 
    transition: transform 0.3s var(--ease-quiet), box-shadow 0.3s var(--ease-quiet), border-color 0.3s var(--ease-quiet); 
  }
  .card:hover { 
    border-color: var(--black); 
    box-shadow: 0 12px 30px rgba(10, 10, 10, 0.08); 
    transform: translateY(-4px); 
  }
  .card__top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .card__title { font-size: 1.3rem; font-weight: 700; margin-right: 1rem; letter-spacing: -0.01em; }
  .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.35rem 0.65rem; border-radius: 4px; white-space: nowrap; }
  .badge--active { background: rgba(10, 10, 10, 0.08); color: var(--black); border: 1px solid rgba(10, 10, 10, 0.1); }
  .badge--completed { background: transparent; color: var(--gray-mid); border: 1px solid var(--gray-light); }
  .card__client { font-size: 0.9rem; color: var(--gray-dark); margin-bottom: 1.5rem; }
  .card__footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(229, 229, 229, 0.6); }
  .timestamp { font-size: 11px; color: var(--gray-mid); }

  .empty-state { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    padding: 6rem 2rem; 
    border: 1px dashed var(--gray-light); 
    border-radius: 16px; 
    background: rgba(255, 255, 255, 0.5); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px); 
  }
  .empty-icon { width: 60px; height: 60px; background: var(--white); border: 1px solid var(--gray-light); border-radius: 12px; display: grid; place-items: center; margin-bottom: 2rem; color: var(--black); }
  .empty-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em; color: var(--black); }
  .empty-title em { font-style: normal; color: var(--gray-mid); font-weight: 800; }
  .empty-text { font-size: 0.95rem; color: var(--gray-dark); max-width: 340px; line-height: 1.6; margin-bottom: 2.5rem; }

  /* ===== Scroll Reveal ===== */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s var(--ease-quiet), transform 0.8s var(--ease-quiet);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Responsive */
  @media (max-width: 880px) { 
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; padding: 1rem 1.5rem; } 
    .brand { margin-bottom: 0; margin-right: auto; }
    .nav-links { display: none; } /* Hide nav links on mobile to simplify */
    .sidebar-footer { border-top: none; padding-top: 0; flex-direction: row; }
    .user-info { display: none; }
    .btn-logout { padding: 0.5rem; }
    .main-content { margin-left: 0; padding: 2rem 1.5rem 4rem; } 
    .page-head { flex-direction: column; align-items: flex-start; gap: 2rem; } 
  }
</style>
</head>
<body>

<!-- Ambient Background Orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<aside class="sidebar">
  <a href="dashboard.html" class="brand">
    <div class="brand__mark">J</div>
    <div class="brand__name">Jessel</div>
  </a>
  
  <nav class="nav-links">
    <a href="dashboard.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Projects
    </a>
    <a href="settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="user-info">
        <span class="user-name">Account</span>
        <span class="user-email">settings</span>
      </div>
    </div>
    <button class="btn-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </button>
  </div>
</aside>

<main class="main-content">
  <div class="page-head reveal">
    <div>
      <div class="eyebrow">Workspace</div>
      <h1 class="page-title">Your <em>projects</em></h1>
    </div>
    <a href="new-project.html" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      New project
    </a>
  </div>
  
  <div id="loadingMsg" style="text-align:center;color:var(--gray-mid);padding:4rem 0;">Loading…</div>
  
  <div class="projects-grid" id="projectsGrid" style="display:none;"></div>
  
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
    <h2 class="empty-title">No projects <em>yet</em></h2>
    <p class="empty-text">Connect a repository or create a project to start automating your client updates. It only takes a moment.</p>
    <a href="new-project.html" class="btn-primary"><span>+ New project</span></a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  async function loadProjects() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: projects, error } = await sb.from('projects').select('*').eq('freelancer_id', user.id).order('created_at', { ascending: false });

    document.getElementById('loadingMsg').style.display = 'none';

    if (error || !projects || projects.length === 0) {
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('emptyState').classList.add('reveal');
      return;
    }

    const grid = document.getElementById('projectsGrid');
    grid.style.display = 'grid';
    grid.innerHTML = projects.map(p => `
      <a href="project-detail.html?id=${p.id}" class="card reveal">
        <div class="card__top">
          <h2 class="card__title">${p.name}</h2>
          <span class="badge ${p.status === 'completed' ? 'badge--completed' : 'badge--active'}">${p.status === 'completed' ? 'Completed' : 'Active'}</span>
        </div>
        <p class="card__client">${p.client_email || 'No client email set'}</p>
        <div class="card__footer">
          <span class="timestamp">Created ${new Date(p.created_at).toLocaleDateString()}</span>
        </div>
      </a>
    `).join('');
  }

  loadProjects();
</script>

<script>
  // Scroll Reveal Animation
  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  revealEls.forEach(el => observer.observe(el));

  // Observe dynamically loaded elements
  const dynamicObserver = new MutationObserver((mutations) => {
    mutations.forEach(mutation => {
      mutation.addedNodes.forEach(node => {
        if (node.nodeType === 1) {
          if (node.classList.contains('reveal')) {
            observer.observe(node);
          }
          node.querySelectorAll?.('.reveal').forEach(child => observer.observe(child));
        }
      });
    });
  });
  dynamicObserver.observe(document.body, { childList: true, subtree: true });
</script>

</body>
</html>
