<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessel — New Project</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230A0A0A'/%3E%3Ctext%20x='50'%20y='68'%20font-family='Inter,%20sans-serif'%20font-weight='700'%20font-size='52'%20fill='%23FFFFFF'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A; --charcoal: #1A1A1A; --gray-dark: #4A4A4A; --gray-mid: #8A8A8A;
    --gray-light: #E5E5E5; --off-white: #FAFAFA; --white: #FFFFFF; --error: #D32F2F;
    --ease-quiet: cubic-bezier(0.22, 1, 0.36, 1); --ease-precise: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; background-color: var(--off-white); color: var(--black); overflow-x: hidden; position: relative; line-height: 1.6; }

  .bg-orbs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; animation: float-orb 20s infinite ease-in-out; }
  .orb-1 { width: 600px; height: 600px; background: #E5E5E5; top: -10%; left: -10%; animation-duration: 25s; }
  .orb-2 { width: 500px; height: 500px; background: #F0F0F0; top: 40%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
  .orb-3 { width: 400px; height: 400px; background: #EFEFEF; bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
  @keyframes float-orb { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(50px, -30px) scale(1.1); } 66% { transform: translate(-30px, 40px) scale(0.95); } }

  .mobile-topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.8); z-index: 99; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
  .mobile-menu-btn { background: none; border: none; color: var(--black); cursor: pointer; padding: 0.5rem; display: flex; align-items: center; }
  .mobile-logo { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; color: var(--black); text-decoration: none; }

  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 4px 0 20px rgba(10, 10, 10, 0.03); display: flex; flex-direction: column; padding: 2rem 1.5rem; z-index: 100; transition: transform 0.3s var(--ease-quiet); }
  .brand { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--black); margin-bottom: 3rem; padding: 0 0.5rem; }
  .brand__mark { width: 32px; height: 32px; background: var(--black); border-radius: 8px; display: grid; place-items: center; color: var(--white); font-size: 1rem; font-weight: 800; }
  .brand__name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

  .nav-links { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }
  .nav-link { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--gray-dark); font-size: 0.95rem; font-weight: 500; padding: 0.75rem 1rem; border-radius: 8px; transition: all 0.2s ease; }
  .nav-link:hover { background: rgba(10, 10, 10, 0.05); color: var(--black); }
  .nav-link.active { background: var(--black); color: var(--white); }
  .nav-link svg { width: 20px; height: 20px; stroke-width: 1.5; }

  .sidebar-footer { border-top: 1px solid rgba(229, 229, 229, 0.6); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .user-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; margin-bottom: 0.5rem; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--black); color: var(--white); display: grid; place-items: center; }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 0.9rem; font-weight: 600; color: var(--black); }
  .user-email { font-size: 0.75rem; color: var(--gray-mid); }

  .btn-logout { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--gray-dark); font-size: 0.95rem; font-weight: 500; padding: 0.75rem 1rem; border-radius: 8px; transition: all 0.2s ease; background: none; border: none; cursor: pointer; font-family: inherit; text-align: left; }
  .btn-logout:hover { background: rgba(10, 10, 10, 0.05); color: var(--black); }
  .btn-logout svg { width: 20px; height: 20px; stroke-width: 1.5; }

  .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 90; opacity: 0; transition: opacity 0.3s ease; }
  .mobile-overlay.active { display: block; opacity: 1; }

  .main-content { margin-left: 260px; padding: 3rem 3rem 6rem; min-height: 100vh; position: relative; max-width: 800px; }
  .page-head { margin-bottom: 3.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--gray-light); }
  .eyebrow { display: inline-flex; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-dark); margin-bottom: 1rem; }
  .page-title { font-weight: 800; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.1; letter-spacing: -0.03em; color: var(--black); }
  .page-title em { font-style: normal; color: var(--gray-mid); font-weight: 800; }

  .form-wrap { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 16px; padding: 3rem; box-shadow: 0 20px 50px rgba(10, 10, 10, 0.08); }

  .field { margin-bottom: 2rem; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-mid); margin-bottom: 0.75rem; }
  .field input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--gray-light); padding: 0.6rem 0 0.9rem; font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 500; color: var(--black); outline: none; transition: border-color 300ms var(--ease-precise); }
  .field input::placeholder { color: var(--gray-mid); font-weight: 400; }
  .field input:focus { border-bottom-color: var(--black); }
  
  .helper-text { display: block; font-size: 0.85rem; color: var(--gray-mid); margin-top: 0.5rem; line-height: 1.4; }

  .toggle-group { display: inline-flex; background: var(--gray-light); padding: 4px; border-radius: 8px; margin-top: -0.25rem; }
  .toggle-group button { border: 0; background: transparent; padding: 0.65rem 1.5rem; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; color: var(--gray-dark); cursor: pointer; border-radius: 6px; transition: all 0.3s var(--ease-quiet); }
  .toggle-group button.active { background: var(--black); color: var(--white); }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem; margin-top: 2.5rem; }
  .cancel-link { font-size: 0.9rem; color: var(--gray-mid); text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
  .cancel-link:hover { color: var(--black); }
  
  .btn-primary { background: var(--black); color: var(--white); border: 1px solid var(--black); padding: 0.8rem 1.4rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s var(--ease-quiet); }
  .btn-primary:hover { background: transparent; color: var(--black); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(10, 10, 10, 0.1); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-error { color: var(--error); font-size: 0.9rem; margin-top: 1rem; padding: 0.75rem 1rem; background: rgba(211, 47, 47, 0.05); border: 1px solid rgba(211, 47, 47, 0.2); border-radius: 6px; display: none; font-weight: 500; }
  .form-error.show { display: block; }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s var(--ease-quiet), transform 0.8s var(--ease-quiet); }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 1024px) {
    .mobile-topbar { display: flex; }
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; padding: 5rem 1.5rem 4rem; }
    .form-wrap { padding: 2rem; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="menuToggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="dashboard.html" class="mobile-logo">Jessel</a>
  <div style="width: 24px;"></div>
</div>

<div class="mobile-overlay" id="mobileOverlay"></div>

<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="brand">
    <div class="brand__mark">J</div>
    <div class="brand__name">Jessel</div>
  </a>
  
  <nav class="nav-links">
    <a href="dashboard.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Projects
    </a>
    <a href="settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="user-info">
        <span class="user-name">Account</span>
        <span class="user-email">settings</span>
      </div>
    </div>
    <button class="btn-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </button>
  </div>
</aside>

<main class="main-content">
  <div class="page-head reveal">
    <div class="eyebrow">New project</div>
    <h1 class="page-title">Set up your <em>workspace</em>.</h1>
  </div>

  <div class="form-wrap reveal" style="transition-delay: 0.1s;">
    <form id="newProjectForm">
      <div class="field">
        <label for="project-name">Project name</label>
        <input id="project-name" type="text" required>
      </div>
      
      <div class="field">
        <label>Connect GitHub repo</label>
        <p class="helper-text" style="margin-top:0;">GitHub connection isn't live yet — you can connect a repo from the project page once that's built.</p>
      </div>
      
      <div class="field">
        <label for="client-email">Client email</label>
        <input id="client-email" type="email">
        <span class="helper-text">We'll use this to send update notifications.</span>
      </div>
      
      <div class="field">
        <label>Update frequency</label>
        <div class="toggle-group" id="freqToggle">
          <button type="button" class="active" data-value="daily">Daily</button>
          <button type="button" data-value="weekly">Weekly</button>
        </div>
      </div>
      
      <div class="field">
        <label>Preview URL <span style="text-transform:lowercase;opacity:0.6;">(optional)</span></label>
        <input id="preview-url" type="text">
        <span class="helper-text">Paste a live link to your project if you have one.</span>
      </div>
      
      <div class="form-error" id="formError"></div>
      
      <div class="actions">
        <a href="dashboard.html" class="cancel-link">Cancel</a>
        <button class="btn-primary" type="submit" id="submitBtn"><span>Create project</span></button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // Mobile Drawer Logic
  const menuToggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  const mobileOverlay = document.getElementById('mobileOverlay');
  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    mobileOverlay.classList.toggle('active');
  });
  mobileOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    mobileOverlay.classList.remove('active');
  });
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 1024) {
        sidebar.classList.remove('open');
        mobileOverlay.classList.remove('active');
      }
    });
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  let frequency = 'daily';
  document.querySelectorAll('#freqToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#freqToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frequency = btn.dataset.value;
    });
  });

  const errorEl = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('newProjectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');

    const name = document.getElementById('project-name').value.trim();
    if (!name) { errorEl.textContent = 'Project name is required.'; errorEl.classList.add('show'); return; }

    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    submitBtn.disabled = true;
    const { error } = await sb.from('projects').insert({
      freelancer_id: user.id,
      name,
      client_email: document.getElementById('client-email').value.trim() || null,
      digest_frequency: frequency,
      preview_url: document.getElementById('preview-url').value.trim() || null,
    });
    submitBtn.disabled = false;

    if (error) { errorEl.textContent = error.message; errorEl.classList.add('show'); return; }
    window.location.href = 'dashboard.html';
  });
</script>

<script>
  // Scroll Reveal Animation
  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  revealEls.forEach(el => observer.observe(el));
</script>

</body>
</html>
