<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessel — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230A0A0A'/%3E%3Ctext%20x='50'%20y='68'%20font-family='Inter,%20sans-serif'%20font-weight='700'%20font-size='52'%20fill='%23FFFFFF'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A; --gray-dark: #4A4A4A; --gray-mid: #8A8A8A;
    --gray-light: #E5E5E5; --off-white: #FAFAFA; --white: #FFFFFF;
    --ease-quiet: cubic-bezier(0.22, 1, 0.36, 1); --ease-precise: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { font-family: 'Inter', sans-serif; background-color: var(--off-white); color: var(--black); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; }

  .bg-orbs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; animation: float-orb 20s infinite ease-in-out; }
  .orb-1 { width: 600px; height: 600px; background: #E5E5E5; top: -10%; left: -10%; animation-duration: 25s; }
  .orb-2 { width: 500px; height: 500px; background: #F0F0F0; bottom: -10%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
  @keyframes float-orb { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(50px, -30px) scale(1.1); } 66% { transform: translate(-30px, 40px) scale(0.95); } }

  .form-wrap { width: 100%; max-width: 440px; padding: 3rem; background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 16px; box-shadow: 0 20px 50px rgba(10, 10, 10, 0.08); text-align: center; }
  
  .brand { display: flex; align-items: center; justify-content: center; gap: 0.8rem; text-decoration: none; color: var(--black); margin-bottom: 2.5rem; }
  .brand__mark { width: 32px; height: 32px; background: var(--black); border-radius: 8px; display: grid; place-items: center; color: var(--white); font-size: 1rem; font-weight: 800; }
  .brand__name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

  .loading-text { color: var(--gray-mid); font-size: 1rem; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--gray-light); border-top-color: var(--black); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .eyebrow { display: inline-flex; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-dark); margin-bottom: 1rem; }
  .form-title { font-weight: 800; font-size: 1.8rem; line-height: 1.2; letter-spacing: -0.03em; color: var(--black); margin-bottom: 0.75rem; }
  .form-sub { font-size: 0.95rem; line-height: 1.6; color: var(--gray-dark); margin-bottom: 2rem; text-align: left; }

  .field { margin-bottom: 1.5rem; text-align: left; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-mid); margin-bottom: 0.75rem; }
  .field input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--gray-light); padding: 0.6rem 0 0.9rem; font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 500; color: var(--black); outline: none; transition: border-color 300ms var(--ease-precise); }
  .field input:focus { border-bottom-color: var(--black); }

  .btn-primary { width: 100%; background: var(--black); color: var(--white); border: 1px solid var(--black); padding: 0.9rem 1.4rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s var(--ease-quiet); margin-top: 0.5rem; }
  .btn-primary:hover { background: transparent; color: var(--black); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .success-box { display: none; }
  .success-icon { width: 40px; height: 40px; background: var(--black); border-radius: 50%; margin: 0 auto 1.5rem; display: grid; place-items: center; color: var(--white); }
  .success-icon svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="form-wrap">
  <a href="login.html" class="brand">
    <div class="brand__mark">J</div>
    <div class="brand__name">Jessel</div>
  </a>

  <!-- Loading State -->
  <div id="loadingState">
    <div class="spinner"></div>
    <p class="loading-text">Verifying your reset link...</p>
  </div>

  <!-- Form State -->
  <div id="formState" style="display: none;">
    <div class="eyebrow">New Password</div>
    <h1 class="form-title">Create a new passphrase</h1>
    <p class="form-sub">Choose a strong password you haven't used before. It must be at least 8 characters long.</p>
    
    <form id="updatePasswordForm">
      <div class="field">
        <label for="password">New passphrase</label>
        <input id="password" type="password" placeholder="••••••••••••" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm passphrase</label>
        <input id="confirmPassword" type="password" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Update password</button>
    </form>
  </div>

  <!-- Success State -->
  <div id="successState" class="success-box">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="form-title">Password updated!</h1>
    <p class="form-sub" style="text-align: center;">Your password has been successfully changed. You can now log in with your new credentials.</p>
    <a href="login.html" class="btn-primary" style="text-decoration: none; display: inline-block; margin-top: 1rem;">Continue to login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const loadingState = document.getElementById('loadingState');
  const formState = document.getElementById('formState');
  const successState = document.getElementById('successState');
  const form = document.getElementById('updatePasswordForm');
  const submitBtn = document.getElementById('submitBtn');

  // Supabase automatically detects the recovery token in the URL.
  // We listen for the auth state change to trigger the UI update.
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      loadingState.style.display = 'none';
      formState.style.display = 'block';
    }
  });

  // Fallback: if the user is already on the page and the token was processed instantly
  setTimeout(() => {
    if (loadingState.style.display !== 'none') {
      // Check if we have a user/session already (which means recovery succeeded instantly)
      sb.auth.getSession().then(({ data }) => {
        if (data.session) {
          loadingState.style.display = 'none';
          formState.style.display = 'block';
        } else {
          // If still no session after 3 seconds, assume link expired
          loadingState.innerHTML = '<p class="loading-text" style="color: #D32F2F;">This password reset link is invalid or has expired. Please request a new one.</p>';
        }
      });
    }
  }, 3000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      alert('Passwords do not match.');
      return;
    }
    if (password.length < 8) {
      alert('Password must be at least 8 characters long.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      const { data, error } = await sb.auth.updateUser({ password: password });
      
      if (error) throw error;

      // Success: show success UI
      formState.style.display = 'none';
      successState.style.display = 'block';

      // Sign out the recovery session so they log in fresh
      await sb.auth.signOut();
    } catch (error) {
      alert(error.message || 'Failed to update password. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    }
  });
</script>

</body>
</html>
