<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Update</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230D2818'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='38'%20fill='none'%20stroke='%23C9A227'%20stroke-width='3'/%3E%3Ctext%20x='50'%20y='68'%20font-family='Georgia,%20serif'%20font-style='italic'%20font-size='52'%20fill='%23C9A227'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">
<style>
  :root { --jungle-deep:#05140A; --jungle-primary:#0D2818; --jungle-secondary:#1A4D2E; --gold:#C9A227; --gold-light:#D4AF37; --gold-dark:#B8860B; --ivory:#F5F5DC; --ivory-card:#FDFDF7; --hairline-dark:rgba(13,40,24,0.15); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:var(--ivory); color:var(--jungle-primary); min-height:100vh; overflow-x:hidden; }
  .container { max-width:720px; margin:0 auto; padding:4rem 2rem 6rem; }
  .brand { display:flex; align-items:center; gap:0.85rem; margin-bottom:3.5rem; text-decoration:none; }
  .brand__mark { width:32px; height:32px; border:1px solid var(--gold); border-radius:50%; display:grid; place-items:center; color:var(--gold); font-family:'Cormorant Garamond',serif; font-style:italic; }
  .eyebrow { display:inline-flex; font-weight:500; font-size:11px; letter-spacing:0.32em; text-transform:uppercase; color:var(--gold-dark); margin-bottom:1.25rem; }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(2.2rem,4vw,2.8rem); margin-bottom:1.5rem; }
  .btn-preview { display:inline-flex; align-items:center; gap:0.65rem; background:var(--jungle-primary); color:var(--ivory); padding:0.85rem 1.5rem; font-size:12px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; text-decoration:none; border-radius:2px; }
  .timeline { position:relative; padding-left:2rem; }
  .entry { position:relative; padding-bottom:3rem; }
  .entry-marker { position:absolute; left:-2rem; top:5px; width:11px; height:11px; border-radius:50%; background:var(--ivory); border:2px solid var(--jungle-secondary); }
  .entry--milestone .entry-marker { width:14px; height:14px; background:var(--gold); border-color:var(--gold-light); left:-2.1rem; transform:rotate(45deg); border-radius:2px; }
  .entry--milestone .entry-card { background:var(--ivory-card); border:1px solid var(--hairline-dark); border-left:2px solid var(--gold); padding:1.5rem 1.75rem; border-radius:2px; }
  .entry--milestone .entry-summary { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:500; margin-bottom:0.75rem; }
  .entry-summary { font-size:17px; line-height:1.6; margin-bottom:0.75rem; }
  .entry-time { font-size:12px; color:rgba(13,40,24,0.45); margin-bottom:1.25rem; }
  .reactions { display:flex; align-items:center; gap:1.5rem; padding-top:1rem; border-top:1px dashed var(--hairline-dark); }
  .react-btn { display:inline-flex; align-items:center; gap:0.5rem; background:transparent; border:1px solid var(--hairline-dark); padding:0.5rem 0.9rem; border-radius:2px; cursor:pointer; font-size:12px; font-weight:500; color:var(--jungle-secondary); }
  .react-btn.active { background:var(--jungle-primary); border-color:var(--jungle-primary); color:var(--ivory); }
  .comment-link { background:transparent; border:0; cursor:pointer; font-size:12px; color:var(--gold-dark); font-weight:500; }
  .comment-box { margin-top:1rem; display:none; flex-direction:column; gap:0.5rem; }
  .comment-box.active { display:flex; }
  .comment-input { width:100%; background:var(--ivory-card); border:1px solid var(--hairline-dark); padding:0.75rem; font-size:14px; outline:none; border-radius:2px; }
  .comment-submit { align-self:flex-end; background:var(--jungle-primary); color:var(--ivory); border:0; padding:0.5rem 1rem; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; border-radius:2px; }
  .footer { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--hairline-dark); text-align:center; font-size:12px; color:rgba(13,40,24,0.4); }
  .empty { text-align:center; padding:4rem 2rem; color:rgba(13,40,24,0.5); font-size:14px; border:1px dashed var(--hairline-dark); border-radius:2px; background:var(--ivory-card); margin-left:-2rem; }
  @media (max-width:640px) { .container{padding:2.5rem 1.5rem 4rem;} .timeline{padding-left:1.5rem;} .entry-marker{left:-1.5rem;} }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand"><div class="brand__mark">J</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500;">Jessel</div></div>
    <div class="eyebrow">Project Update</div>
    <h1 id="projectName">Loading…</h1>
    <a href="#" class="btn-preview" id="previewBtn" style="display:none;">
      <span>View live preview</span>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
    </a>
  </header>
  <div class="timeline" id="timeline"></div>
  <footer class="footer">Powered by Jessel</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('p');
  let projectId = null;

  async function load() {
    if (!slug) { document.getElementById('projectName').textContent = 'Project link not found'; return; }

    const { data: proj } = await sb.from('projects').select('*').eq('client_link_slug', slug).single();
    if (!proj) { document.getElementById('projectName').textContent = 'Project link not found'; return; }

    projectId = proj.id;
    document.getElementById('projectName').textContent = proj.name;

    if (proj.preview_url) {
      const btn = document.getElementById('previewBtn');
      btn.href = proj.preview_url;
      btn.target = '_blank';
      btn.style.display = 'inline-flex';
    }

    const { data: updates } = await sb.from('updates').select('*').eq('project_id', proj.id).order('created_at', { ascending: false });
    renderTimeline(updates || []);
  }

  function renderTimeline(updates) {
    const el = document.getElementById('timeline');
    if (updates.length === 0) {
      el.innerHTML = '<div class="empty">No updates yet. Check back soon.</div>';
      return;
    }
    el.innerHTML = updates.map(u => `
      <article class="entry ${u.type === 'milestone' ? 'entry--milestone' : ''}" data-id="${u.id}">
        <div class="entry-marker"></div>
        <div class="entry-card">
          <p class="entry-summary">${(u.friendly_summary || u.raw_message || '').replace(/</g, '&lt;')}</p>
          <div class="entry-time">${new Date(u.created_at).toLocaleString()}</div>
          <div class="reactions">
            <button class="react-btn" data-react="${u.id}">👍 Looks good</button>
            <button class="comment-link" data-comment="${u.id}">Leave a comment</button>
          </div>
          <div class="comment-box" id="comment-box-${u.id}">
            <textarea class="comment-input" rows="3" placeholder="Leave a note for the team..." id="comment-input-${u.id}"></textarea>
            <button class="comment-submit" data-submit="${u.id}">Post comment</button>
          </div>
        </div>
      </article>
    `).join('');

    document.querySelectorAll('[data-react]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.classList.toggle('active');
        if (btn.classList.contains('active')) {
          await sb.from('reactions').insert({ update_id: btn.dataset.react, emoji_or_comment: '👍 Looks good' });
        }
      });
    });
    document.querySelectorAll('[data-comment]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('comment-box-' + btn.dataset.comment).classList.toggle('active');
      });
    });
    document.querySelectorAll('[data-submit]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.submit;
        const input = document.getElementById('comment-input-' + id);
        const text = input.value.trim();
        if (!text) return;
        await sb.from('reactions').insert({ update_id: id, emoji_or_comment: text });
        input.value = '';
        document.getElementById('comment-box-' + id).classList.remove('active');
      });
    });
  }

  load();
</script>
</body>
</html>
