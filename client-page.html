<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Update</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230A0A0A'/%3E%3Ctext%20x='50'%20y='68'%20font-family='Inter,%20sans-serif'%20font-weight='700'%20font-size='52'%20fill='%23FFFFFF'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A;
    --charcoal: #1A1A1A;
    --gray-dark: #4A4A4A;
    --gray-mid: #8A8A8A;
    --gray-light: #E5E5E5;
    --off-white: #FAFAFA;
    --white: #FFFFFF;
    --terracotta: #D32F2F; /* Standard professional error red */
    --ease-quiet: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-precise: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--off-white);
    color: var(--black);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.6;
  }

  /* ===== Ambient Background Motion ===== */
  .bg-orbs {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; animation: float-orb 20s infinite ease-in-out; }
  .orb-1 { width: 600px; height: 600px; background: #E5E5E5; top: -10%; left: -10%; animation-duration: 25s; }
  .orb-2 { width: 500px; height: 500px; background: #F0F0F0; top: 40%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
  .orb-3 { width: 400px; height: 400px; background: #EFEFEF; bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
  @keyframes float-orb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, -30px) scale(1.1); }
    66% { transform: translate(-30px, 40px) scale(0.95); }
  }

  /* ===== Layout & Glassmorphism ===== */
  .container {
    max-width: 720px;
    margin: 4rem auto;
    padding: 3rem;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(10, 10, 10, 0.08);
    position: relative;
    z-index: 1;
  }

  .header { margin-bottom: 4rem; }
  .brand { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 3rem; text-decoration: none; color: var(--black); }
  .brand__mark { width: 28px; height: 28px; background: var(--black); border-radius: 6px; display: grid; place-items: center; color: var(--white); font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 800; }
  .brand__name { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }

  .eyebrow { display: inline-flex; align-items: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-dark); margin-bottom: 1.25rem; }
  .eyebrow::after { content: ''; display: inline-block; width: 2rem; height: 1px; margin-left: 1rem; background: var(--gray-dark); }

  h1 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: clamp(2.2rem, 4vw, 2.8rem); line-height: 1.1; color: var(--black); letter-spacing: -0.03em; margin-bottom: 1.5rem; }
  h1 em { font-style: normal; color: var(--gray-mid); font-weight: 800; }

  .btn-preview { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--black); color: var(--white); border: 1px solid var(--black); padding: 0.8rem 1.4rem; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer; border-radius: 6px; transition: all 0.2s var(--ease-quiet); }
  .btn-preview:hover { background: transparent; color: var(--black); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(10, 10, 10, 0.1); }
  .btn-preview svg { transition: transform 400ms var(--ease-quiet); }
  .btn-preview:hover svg { transform: translateX(4px); }

  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 5px; bottom: 5px; width: 1px; background: var(--gray-light); }

  .entry { position: relative; padding-bottom: 3rem; }
  .entry-marker { position: absolute; left: -2rem; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--off-white); border: 2px solid var(--gray-dark); z-index: 1; }

  .entry--milestone .entry-marker { width: 14px; height: 14px; background: var(--black); border-color: var(--charcoal); left: -2.1rem; transform: rotate(45deg); border-radius: 2px; }
  .entry--milestone .entry-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); border-left: 2px solid var(--black); padding: 1.5rem 1.75rem; border-radius: 12px; }
  .entry--milestone .entry-summary { font-family: 'Inter', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--black); margin-bottom: 0.75rem; line-height: 1.3; letter-spacing: -0.02em; }

  .entry-card { padding-right: 0.5rem; }
  .entry-summary { font-size: 1.1rem; line-height: 1.6; color: var(--gray-dark); margin-bottom: 0.75rem; font-weight: 400; }

  .entry-time { font-size: 12px; color: var(--gray-mid); letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
  .entry-time svg { width: 12px; height: 12px; }

  .reactions { display: flex; align-items: center; gap: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--gray-light); }
  .react-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid var(--gray-light); padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--gray-dark); letter-spacing: 0.01em; transition: all 200ms var(--ease-precise); }
  .react-btn:hover { border-color: var(--black); background: rgba(10, 10, 10, 0.05); }
  .react-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }

  .comment-link { background: transparent; border: 0; cursor: pointer; font-size: 12px; color: var(--black); font-weight: 600; letter-spacing: 0.01em; padding: 0.5rem 0; transition: color 200ms var(--ease-precise); }
  .comment-link:hover { color: var(--gray-mid); text-decoration: underline; }

  .comment-box { margin-top: 1rem; display: none; flex-direction: column; gap: 0.5rem; }
  .comment-box.active { display: flex; }
  .comment-input { width: 100%; background: rgba(255, 255, 255, 0.6); border: 1px solid var(--gray-light); padding: 0.75rem; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--black); outline: none; border-radius: 8px; transition: border-color 300ms var(--ease-precise); }
  .comment-input:focus { border-color: var(--black); }
  .comment-submit { align-self: flex-end; background: var(--black); color: var(--white); border: 0; padding: 0.5rem 1rem; font-size: 11px; font-weight: 600; text-transform: uppercase; cursor: pointer; border-radius: 6px; }

  .existing-feedback { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .feedback-item { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 13px; color: var(--gray-dark); background: rgba(255, 255, 255, 0.4); border: 1px solid var(--gray-light); border-radius: 8px; padding: 0.6rem 0.85rem; }
  .feedback-item .fi-text { flex: 1; word-break: break-word; }
  .feedback-item .fi-time { font-size: 11px; color: var(--gray-mid); margin-left: 0.4rem; }
  
  .feedback-item .fi-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .feedback-item .fi-edit { background: none; border: 0; color: var(--black); cursor: pointer; font-size: 11px; text-decoration: underline; font-weight: 600; }
  .feedback-item .fi-edit:hover { color: var(--gray-mid); }
  .feedback-item .fi-separator { opacity: 0.3; font-size: 11px; }
  .feedback-item .fi-delete { background: none; border: 0; color: var(--terracotta); cursor: pointer; font-size: 11px; text-decoration: underline; font-weight: 600; }
  .feedback-item .fi-delete:hover { color: var(--terracotta); }
  
  .feedback-item .fi-save { background: var(--black); color: var(--white); border: 0; padding: 0.3rem 0.6rem; font-size: 10px; font-weight: 600; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
  .feedback-item .fi-cancel { background: transparent; border: 0; color: var(--gray-mid); cursor: pointer; font-size: 11px; text-decoration: underline; font-weight: 600; }
  .feedback-item .fi-edit-input { width: 100%; background: var(--white); border: 1px solid var(--black); padding: 0.25rem; font-size: 13px; color: var(--black); outline: none; border-radius: 4px; }

  .footer { margin-top: 5rem; padding-top: 2rem; border-top: 1px solid var(--gray-light); text-align: center; font-size: 12px; color: var(--gray-mid); font-weight: 500; }
  .empty { text-align: center; padding: 4rem 2rem; color: var(--gray-mid); font-size: 14px; border: 1px dashed var(--gray-light); border-radius: 12px; background: rgba(255, 255, 255, 0.5); margin-left: -2rem; }

  /* ===== Scroll Reveal ===== */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s var(--ease-quiet), transform 0.8s var(--ease-quiet); }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) {
    .container { margin: 2rem 1rem; padding: 2rem 1.5rem; }
    .timeline { padding-left: 1.5rem; }
    .entry-marker, .entry--milestone .entry-marker { left: -1.5rem; }
    .entry-summary { font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- Ambient Background Orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="container reveal">
  <header class="header">
    <a href="#" class="brand">
      <div class="brand__mark">J</div>
      <div class="brand__name">Jessel</div>
    </a>
    
    <div class="eyebrow">Project Update</div>
    <h1 id="projectName">Loading…</h1>
    
    <a href="#" class="btn-preview" id="previewBtn" style="display:none;">
      <span>View live preview</span>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      </svg>
    </a>
  </header>

  <div class="timeline" id="timeline"></div>

  <footer class="footer">
    Powered by Jessel
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('p');
  let projectId = null;

  function getMyCommentIds() {
    try { return JSON.parse(sessionStorage.getItem('jessel_my_comments') || '[]'); }
    catch { return []; }
  }
  function rememberMyComment(id) {
    const ids = getMyCommentIds();
    ids.push(id);
    sessionStorage.setItem('jessel_my_comments', JSON.stringify(ids));
  }

  async function load() {
    if (!slug) { 
      document.getElementById('projectName').textContent = 'Project link not found'; 
      return; 
    }

    const { data: proj } = await sb.from('projects').select('*').eq('client_link_slug', slug).single();
    if (!proj) { 
      document.getElementById('projectName').textContent = 'Project link not found'; 
      return; 
    }

    projectId = proj.id;
    
    const nameEl = document.getElementById('projectName');
    nameEl.textContent = proj.name;

    if (proj.preview_url) {
      const btn = document.getElementById('previewBtn');
      btn.href = proj.preview_url;
      btn.target = '_blank';
      btn.style.display = 'inline-flex';
    }

    loadUpdatesAgain();
  }

  async function loadUpdatesAgain() {
    const { data: updates } = await sb.from('updates').select('*').eq('project_id', projectId).order('created_at', { ascending: false });
    renderTimeline(updates || []);
  }

  async function renderTimeline(updates) {
    const el = document.getElementById('timeline');
    if (updates.length === 0) {
      el.innerHTML = '<div class="empty">No updates yet. Check back soon.</div>';
      return;
    }

    const updateIds = updates.map(u => u.id);
    const { data: allReactions } = await sb.from('reactions').select('*').in('update_id', updateIds).order('created_at', { ascending: true });
    
    const reactionsByUpdate = {};
    (allReactions || []).forEach(r => {
      if (!reactionsByUpdate[r.update_id]) reactionsByUpdate[r.update_id] = [];
      reactionsByUpdate[r.update_id].push(r);
    });

    el.innerHTML = updates.map(u => {
      const feedback = reactionsByUpdate[u.id] || [];
      const myIds = getMyCommentIds();
      
      const feedbackHtml = feedback.length === 0 ? '' : `
        <div class="existing-feedback">
          ${feedback.map(f => `
            <div class="feedback-item" data-reaction-id="${f.id}">
              <span class="fi-text" id="fi-text-${f.id}">${f.emoji_or_comment.replace(/</g, '&lt;')}<span class="fi-time">${new Date(f.created_at).toLocaleString()}</span></span>
              ${myIds.includes(f.id) ? `
                <div class="fi-actions" id="fi-actions-${f.id}">
                  <button class="fi-edit" data-edit-reaction="${f.id}">Edit</button>
                  <span class="fi-separator">·</span>
                  <button class="fi-delete" data-delete-reaction="${f.id}">Remove</button>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;

      const isMilestone = u.type === 'milestone';
      const summaryText = (u.friendly_summary || u.raw_message || '').replace(/</g, '&lt;');
      
      const timeIcon = isMilestone ? 
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg" style="color: var(--black);"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>` :
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;

      return `
        <article class="entry ${isMilestone ? 'entry--milestone' : ''}" data-id="${u.id}">
          <div class="entry-marker"></div>
          <div class="entry-card">
            <p class="entry-summary">${summaryText}</p>
            <div class="entry-time">
              ${timeIcon}
              <span>${new Date(u.created_at).toLocaleString()}</span>
            </div>
            ${feedbackHtml}
            <div class="reactions">
              <button class="react-btn" data-react="${u.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                Looks good
              </button>
              <button class="comment-link" data-comment="${u.id}">Leave a comment</button>
            </div>
            <div class="comment-box" id="comment-box-${u.id}">
              <textarea class="comment-input" rows="3" placeholder="Leave a note for the team..." id="comment-input-${u.id}"></textarea>
              <button class="comment-submit" data-submit="${u.id}">Post comment</button>
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  document.getElementById('timeline').addEventListener('click', async (e) => {
    const editBtn = e.target.closest('[data-edit-reaction]');
    const cancelBtn = e.target.closest('[data-cancel-reaction]');
    const saveBtn = e.target.closest('[data-save-reaction]');
    const deleteBtn = e.target.closest('[data-delete-reaction]');
    const reactBtn = e.target.closest('[data-react]');
    const commentBtn = e.target.closest('[data-comment]');
    const submitBtn = e.target.closest('[data-submit]');

    if (editBtn) {
      const id = editBtn.dataset.editReaction;
      const textEl = document.getElementById(`fi-text-${id}`);
      const actionsEl = document.getElementById(`fi-actions-${id}`);
      
      const currentText = textEl.childNodes[0].nodeValue.trim();
      
      textEl.dataset.originalHtml = textEl.innerHTML;
      textEl.innerHTML = `<input type="text" class="fi-edit-input" id="fi-input-${id}" value="${currentText.replace(/"/g, '&quot;')}">`;
      
      actionsEl.innerHTML = `
        <button class="fi-save" data-save-reaction="${id}">Save</button>
        <button class="fi-cancel" data-cancel-reaction="${id}">Cancel</button>
      `;
      document.getElementById(`fi-input-${id}`).focus();
    }

    if (cancelBtn) {
      const id = cancelBtn.dataset.cancelReaction;
      const textEl = document.getElementById(`fi-text-${id}`);
      const actionsEl = document.getElementById(`fi-actions-${id}`);
      
      textEl.innerHTML = textEl.dataset.originalHtml;
      actionsEl.innerHTML = `
        <button class="fi-edit" data-edit-reaction="${id}">Edit</button>
        <span class="fi-separator">·</span>
        <button class="fi-delete" data-delete-reaction="${id}">Remove</button>
      `;
    }

    // Save Edit Click — actually saves to Supabase
    if (saveBtn) {
      const id = saveBtn.dataset.saveReaction;
      const input = document.getElementById(`fi-input-${id}`);
      const newText = input.value.trim();
      if (!newText) return;

      const { error } = await sb.from('reactions').update({ emoji_or_comment: newText }).eq('id', id);
      if (error) {
        alert('Failed to save. Please try again.');
        return;
      }
      loadUpdatesAgain();
    }

    if (deleteBtn) {
      if (!confirm('Remove this comment?')) return;
      await sb.from('reactions').delete().eq('id', deleteBtn.dataset.deleteReaction);
      loadUpdatesAgain();
    }

    if (reactBtn) {
      reactBtn.classList.toggle('active');
      if (reactBtn.classList.contains('active')) {
        const { data } = await sb.from('reactions').insert({ update_id: reactBtn.dataset.react, emoji_or_comment: '👍 Looks good' }).select().single();
        if (data) rememberMyComment(data.id);
        loadUpdatesAgain();
      }
    }

    if (commentBtn) {
      document.getElementById('comment-box-' + commentBtn.dataset.comment).classList.toggle('active');
    }

    if (submitBtn) {
      const id = submitBtn.dataset.submit;
      const input = document.getElementById('comment-input-' + id);
      const text = input.value.trim();
      if (!text) return;
      const { data } = await sb.from('reactions').insert({ update_id: id, emoji_or_comment: text }).select().single();
      if (data) rememberMyComment(data.id);
      input.value = '';
      loadUpdatesAgain();
    }
  });

  load();
</script>

<script>
  // Scroll Reveal Animation (Safe addition for motion graphics)
  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  // Observe static elements
  revealEls.forEach(el => observer.observe(el));

  // Observe dynamically loaded elements (like timeline items)
  const dynamicObserver = new MutationObserver((mutations) => {
    mutations.forEach(mutation => {
      mutation.addedNodes.forEach(node => {
        if (node.nodeType === 1) {
          if (node.classList.contains('reveal')) {
            observer.observe(node);
          }
          node.querySelectorAll?.('.reveal').forEach(child => observer.observe(child));
        }
      });
    });
  });
  dynamicObserver.observe(document.body, { childList: true, subtree: true });
</script>

</body>
</html>
